<body>
<input type="file" id="inputChat" accept=".txt"/>
<input type="file" id="inputCSV"  accept=".csv"/>

<div class="header">
  <div class="dot"></div>
  <div class="logo">WORKSHOP SENTIMENT ANALYSER</div>
  <div class="badge">No API Key · 100% In-Browser · Deduped · Contact Enriched</div>
</div>
<div class="page" id="app"></div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
var S = {
  phase:'upload', chatReady:false, csvReady:false,
  chatName:'', csvName:'',
  messages:[], rawFlags:[], results:[],
  attendees:[], // deduped by email
  filter:'ALL', search:'', err:''
};

// ── RULES ─────────────────────────────────────────────────────────────────────
var HOSTS = ['team be10x','aman saurav','prakhar bafna'];
var CAT_RANK = {FLAG_WORD:4,UPSELLING:3,CONTENT:2,RECORDING:1};
var SEV_RANK  = {HIGH:2,MEDIUM:1};
var RULES = [
  {cat:'FLAG_WORD',sev:'HIGH',
   pats:[/\bscam\b/i,/\bwaste\b/i,/\bfake\b/i,/\bfraud\b/i,/\bcheat\b/i],
   hi:[], reason:'Contains strong negative flag word'},
  {cat:'UPSELLING',
   pats:[/just promoting/i,/only promoting/i,/just promotion/i,/its just promotion/i,
         /stop\s*(this\s*)?marketing/i,/stop\s*and\s*start teaching/i,/start teaching/i,
         /wasting\s*(our\s*)?time/i,/waste of time/i,
         /half an hour.*prais/i,/praising.*self/i,/prais.*urself/i,
         /past.{0,20}hour.*promot/i,/we.*not paid for this/i,/not paid for this/i,
         /stop.*(success stories|testimonials)/i,/for the past.*promot/i,
         /more than half.*prais/i,/just praising/i],
   hi:[/stop.*marketing/i,/wasting.*time/i,/not paid/i,/praising/i,/past.*hour/i,/start teaching/i],
   reason:'Complaint about excessive course promotion or upselling'},
  {cat:'RECORDING',
   pats:[/can\s*(i|we)\s*get\s*(the\s*)?recording/i,
         /will.{0,20}(get|have|receive).{0,20}recording/i,
         /share\s*(this\s*)?recording/i,/pls\s*share.*recording/i,
         /please\s*share.*recording/i,/is.{0,15}recorded/i,
         /will.{0,20}be\s*recorded/i,/recording.{0,10}(session|provided)/i,
         /also\s*can\s*we\s*get.*recording/i,/lecture.{0,20}recording/i,
         /missed.{0,30}(session|class)/i],
   hi:[], reason:'Requested session recording or asked if session is recorded'},
  {cat:'CONTENT',
   pats:[/useless/i,/not\s*(happy|satisfied)\s*with/i,/not\s*(helpful|useful)/i,
         /not really.{0,20}helpful/i,/i\s*(quit|am leaving)/i,
         /already know/i,/we know this/i,/we already know/i,
         /too basic/i,/very basic/i,/nothing new/i,
         /not.*relevant.*to me/i,/not even relevant/i,/courses are not.*relevant/i,
         /needs?\s*more\s*detail/i,/more detailed/i,/things have to be more/i,
         /what is the actual catch/i,/not practical/i,/no practical/i,
         /feels like compromising/i,/compromising personal data/i,
         /not worth/i,/pathetic/i,/terrible/i,/so boring/i,
         /waste.{0,12}(this|session|workshop)/i],
   hi:[/useless/i,/i quit/i,/not happy/i,/not relevant/i,/nothing new/i,/already know/i,/pathetic/i,/not worth/i,/terrible/i],
   reason:'Dissatisfied with workshop content quality or relevance'}
];

// ── PARSE ZOOM CHAT ───────────────────────────────────────────────────────────
function parseChat(txt) {
  var msgs=[], cur=null;
  txt.split('\n').forEach(function(raw){
    var line=raw.replace(/\r$/,'');
    var m=line.match(/^(\d{2}:\d{2}:\d{2}) From (.+?) to (.+?):\s*$/);
    if(m){if(cur)msgs.push(cur);cur={ts:m[1],name:m[2].trim(),msg:''};}
    else if(cur&&(line[0]==='\t'||line.slice(0,2)==='  '))
      cur.msg+=(cur.msg?' ':'')+line.replace(/^\s+/,'');
  });
  if(cur)msgs.push(cur);
  return msgs;
}

// ── PARSE ZOOM ATTENDEE CSV (skip metadata rows, find real header) ────────────
function parseAttendeeCSV(txt) {
  var lines = txt.split(/\r?\n/);
  // Find the row that has both 'Email' and 'First Name' - that's the real header
  var headerIdx = -1;
  for(var i=0;i<lines.length;i++){
    if(lines[i].indexOf('First Name')>=0 && lines[i].indexOf('Email')>=0){
      headerIdx=i; break;
    }
  }
  // Fallback: find row with just Email + User Name
  if(headerIdx<0){
    for(var i=0;i<lines.length;i++){
      if(lines[i].indexOf('User Name')>=0 && lines[i].indexOf('Email')>=0){
        headerIdx=i; break;
      }
    }
  }
  if(headerIdx<0) return [];

  var headers = splitCSV(lines[headerIdx]);
  var rows = [];
  for(var i=headerIdx+1;i<lines.length;i++){
    if(!lines[i].trim()) continue;
    var vals = splitCSV(lines[i]);
    var obj={};
    headers.forEach(function(h,j){obj[h.trim()]=(vals[j]||'').trim();});
    rows.push(obj);
  }

  // Dedupe by email — keep row that has phone
  var byEmail={};
  rows.forEach(function(r){
    var email=(r['Email']||'').trim().toLowerCase();
    if(!email||email.indexOf('@')<0) return;
    var phone=cleanPhone(r['Phone']||r['Mobile']||'');
    var uname=(r['User Name (Original Name)']||r['Name']||'').trim();
    var fname=(r['First Name']||'').trim();
    var lname=(r['Last Name']||'').trim();
    var full=(fname+' '+lname).trim();
    var existing=byEmail[email];
    if(!existing||(phone&&!existing.phone)){
      byEmail[email]={uname:uname,fname:fname,lname:lname,full:full,
                      email:email,phone:phone};
    }
  });
  return Object.values(byEmail);
}

function splitCSV(line){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){
    var c=line[i];
    if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){res.push(cur.trim());cur='';}
    else cur+=c;
  }
  res.push(cur.trim());return res;
}

function cleanPhone(p){
  // Remove leading ', spaces, country code prefixes like +91
  return p.replace(/^['+\s]+/,'').replace(/\s+/g,'');
}

// ── NAME MATCHING ─────────────────────────────────────────────────────────────
function normN(n){
  return (n||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();
}
function normStrict(n){
  return (n||'').toLowerCase().replace(/[^a-z]/g,'');
}
function tokN(n){
  return normN(n).split(' ').filter(function(t){return t.length>1;});
}

// Build fast lookup index from attendees
function buildIndex(attendees){
  var idx={};
  attendees.forEach(function(a){
    // Index by strict normalised uname
    var ku=normStrict(a.uname);
    if(ku.length>2) idx[ku]=a;
    // Index by strict normalised full name
    var kf=normStrict(a.full);
    if(kf.length>2) idx[kf]=a;
    // Index by first name only (for single-name chat users)
    var kfn=normStrict(a.fname);
    if(kfn.length>3 && !idx[kfn]) idx[kfn]=a;
  });
  return idx;
}

function findAttendee(chatName, attendees, idx){
  var cn=normStrict(chatName);
  var ct=tokN(chatName);
  if(!cn||ct.length===0) return null;

  // 1. Exact strict match
  if(idx[cn]) return idx[cn];

  // 2. Chat name contained in attendee name or vice versa (handles "Subhisha C" → "Subhisha Chandran")
  if(cn.length>4){
    for(var email in idx){
      var a=idx[email];
      var ku=normStrict(a.uname), kf=normStrict(a.full);
      if(ku.indexOf(cn)===0||kf.indexOf(cn)===0) return a; // starts with chat name
      if(cn.indexOf(ku)===0 && ku.length>4) return a;
    }
  }

  // 3. Token matching — ALL tokens from chat name must appear in attendee name
  var best=null, bestScore=0;
  attendees.forEach(function(a){
    ['uname','full'].forEach(function(field){
      var at=tokN(a[field]);
      if(!at.length) return;
      // Count how many chat tokens appear in attendee tokens
      var matched=ct.filter(function(t){return at.indexOf(t)>=0;});
      if(matched.length===0) return;
      // All chat tokens matched = very confident
      if(matched.length===ct.length){
        var score=matched.length/(Math.max(ct.length,at.length));
        if(score>bestScore){bestScore=score;best=a;}
      }
    });
  });
  return bestScore>=0.5 ? best : null;
}

// ── ANALYSE CHAT ──────────────────────────────────────────────────────────────
function analyse(messages){
  var found=[];
  messages.forEach(function(m){
    if(HOSTS.some(function(h){return m.name.toLowerCase().indexOf(h)>=0;})) return;
    var txt=m.msg.trim();
    if(txt.length<8) return;
    RULES.forEach(function(rule){
      for(var p=0;p<rule.pats.length;p++){
        if(!rule.pats[p].test(txt)) continue;
        var sev=rule.sev||'MEDIUM';
        if(rule.hi&&rule.hi.some(function(hp){return hp.test(txt);})) sev='HIGH';
        found.push({name:m.name.trim(),ts:m.ts,msg:txt,cat:rule.cat,sev:sev,reason:rule.reason});
        break;
      }
    });
  });
  return found;
}

function dedup(raw){
  var map={};
  raw.forEach(function(r){
    var k=normStrict(r.name);
    if(!map[k]){map[k]=r;}
    else{
      var nr=CAT_RANK[r.cat]*10+SEV_RANK[r.sev];
      var er=CAT_RANK[map[k].cat]*10+SEV_RANK[map[k].sev];
      if(nr>er) map[k]=r;
    }
  });
  return Object.values(map);
}

function enrich(deduped, attendees){
  if(!attendees.length) return deduped.map(function(r){return Object.assign({},r,{email:'',phone:'',found:false});});
  var idx=buildIndex(attendees);
  return deduped.map(function(r){
    var a=findAttendee(r.name, attendees, idx);
    return Object.assign({},r,{
      email: a ? a.email : '',
      phone: a ? a.phone : '',
      found: !!a
    });
  });
}

// ── RUN ───────────────────────────────────────────────────────────────────────
function runAnalysis(){
  try{
    var raw=analyse(S.messages);
    var deduped=dedup(raw);
    S.rawFlags=raw;
    S.results=enrich(deduped, S.attendees);
    S.phase='results'; render();
  }catch(e){S.err='Error: '+e.message; render();}
}

// ── CSV DOWNLOAD ──────────────────────────────────────────────────────────────
function dlCSV(){
  var vis=visible();
  var hasCon=vis.some(function(r){return r.email||r.phone;});
  var q=function(s){return '"'+String(s||'').replace(/"/g,'""')+'"';};
  var hdr=['Name','Timestamp','Message','Category','Severity','Reason'];
  if(hasCon) hdr=hdr.concat(['Email','Phone','Contact Found']);
  var rows=vis.map(function(r){
    var row=[q(r.name),q(r.ts),q(r.msg),q(r.cat),q(r.sev),q(r.reason)];
    if(hasCon) row=row.concat([q(r.email),q(r.phone),q(r.found?'Yes':'No')]);
    return row.join(',');
  });
  var csv=[hdr.join(',')].concat(rows).join('\n');
  var url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));
  var a=document.createElement('a');a.href=url;a.download='dissatisfied_attendees.csv';a.click();
  URL.revokeObjectURL(url);
}

function visible(){
  return S.results.filter(function(r){
    if(S.filter!=='ALL'&&r.cat!==S.filter) return false;
    if(S.search){
      var hay=(r.name+' '+r.msg+' '+(r.email||'')+' '+(r.phone||'')).toLowerCase();
      if(hay.indexOf(S.search.toLowerCase())<0) return false;
    }
    return true;
  });
}

// ── HTML ESCAPE ───────────────────────────────────────────────────────────────
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(){
  document.getElementById('app').innerHTML =
    S.phase==='upload' ? renderUpload() : renderResults();
  bind();
}

function renderUpload(){
  var errHtml=S.err?'<div class="err">⚠ '+e(S.err)+'</div>':'';
  var chatBox=S.chatReady
    ?'<div class="card-icon">✅</div><div class="card-title">Zoom Chat Log</div><div class="card-done">'+e(S.chatName)+'</div>'
    :'<div class="card-icon">💬</div><div class="card-title">Zoom Chat Log</div><div class="card-hint">.txt · Zoom chat export</div>';
  var csvBox=S.csvReady
    ?'<div class="card-icon">✅</div><div class="card-title">Attendee Report</div><div class="card-done">'+e(S.csvName)+' · '+S.attendees.length+' attendees</div>'
    :'<div class="card-icon">📋</div><div class="card-title">Attendee Report</div><div class="card-hint">.csv · Zoom Attendee Report</div><div class="card-opt">optional — for email & phone lookup</div>';

  return '<div class="up-wrap">'+
    '<div><div class="hero">Workshop<br><span style="color:#f59e0b">Sentiment Analyser</span></div>'+
    '<div class="hero-sub">Upload Zoom chat log to find unhappy attendees. Add attendee CSV to fetch their email & phone.</div></div>'+
    errHtml+
    '<div class="upload-grid">'+
      '<div class="upload-card '+(S.chatReady?'done':'')+'" id="cardChat">'+chatBox+
        '<button class="pick-btn" id="btnChat">'+(S.chatReady?'↺ Change':'📂 Choose .txt')+'</button>'+
      '</div>'+
      '<div class="upload-card '+(S.csvReady?'done':'')+'" id="cardCSV">'+csvBox+
        '<button class="pick-btn" id="btnCSV">'+(S.csvReady?'↺ Change':'📂 Choose .csv')+'</button>'+
      '</div>'+
    '</div>'+
    '<button class="btn-run '+(S.chatReady?'on':'')+'" id="btnRun">→ Analyse Now</button>'+
    '<div class="detect-grid">'+
      '<div class="dc"><div class="di">📚</div><div class="dcat" style="color:#fb923c">CONTENT</div><div class="dd">Too basic, irrelevant, already known</div></div>'+
      '<div class="dc"><div class="di">🎬</div><div class="dcat" style="color:#60a5fa">RECORDING</div><div class="dd">Recording requests & complaints</div></div>'+
      '<div class="dc"><div class="di">💸</div><div class="dcat" style="color:#f87171">UPSELLING</div><div class="dd">Excessive promotion complaints</div></div>'+
      '<div class="dc"><div class="di">🚩</div><div class="dcat" style="color:#dc2626">FLAG WORD</div><div class="dd">"scam","waste","fake","fraud"</div></div>'+
    '</div>'+
    '<div style="font-size:11px;color:#374151;font-family:\'JetBrains Mono\',monospace">✦ Files never leave your device ✦</div>'+
  '</div>';
}

function renderResults(){
  var vis=visible();
  var cats={CONTENT:0,RECORDING:0,UPSELLING:0,FLAG_WORD:0};
  S.results.forEach(function(r){if(cats[r.cat]!==undefined)cats[r.cat]++;});
  var hasCon=S.attendees.length>0;
  var matchN=S.results.filter(function(r){return r.found;}).length;

  var statsD=[
    {l:'UNIQUE PEOPLE',v:S.results.length,c:'#ef4444'},
    {l:'CONTENT',v:cats.CONTENT,c:'#fb923c'},
    {l:'RECORDING',v:cats.RECORDING,c:'#60a5fa'},
    {l:'UPSELLING',v:cats.UPSELLING,c:'#f87171'},
    {l:'FLAG WORD',v:cats.FLAG_WORD,c:'#dc2626'}
  ];
  if(hasCon) statsD.push({l:'CONTACTS FOUND',v:matchN,c:'#22c55e'});
  var statsHTML=statsD.map(function(s){
    return '<div class="stat"><div class="sv" style="color:'+s.c+'">'+s.v+'</div><div class="sl">'+s.l+'</div></div>';
  }).join('');

  var fbtns=['ALL','CONTENT','RECORDING','UPSELLING','FLAG_WORD'].map(function(f){
    var lbl={ALL:'All',CONTENT:'📚 Content',RECORDING:'🎬 Recording',UPSELLING:'💸 Upselling',FLAG_WORD:'🚩 Flag Word'}[f];
    return '<button class="fb'+(S.filter===f?' on':'')+'" data-f="'+f+'">'+lbl+'</button>';
  }).join('');

  // Dynamic column widths
  var W=hasCon
    ?['145px','66px','minmax(120px,1fr)','108px','62px','140px','155px','115px','68px']
    :['160px','70px','minmax(150px,1fr)','112px','66px','minmax(150px,1fr)'];
  var gridTpl='display:grid;grid-template-columns:'+W.join(' ');

  var headCols=hasCon
    ?['NAME','TIME','MESSAGE','CATEGORY','SEV','REASON','EMAIL','PHONE','MATCH']
    :['NAME','TIME','MESSAGE','CATEGORY','SEV','REASON'];
  var headHTML=headCols.map(function(c){return '<div class="th">'+c+'</div>';}).join('');

  var CLBL={CONTENT:'📚 CONTENT',RECORDING:'🎬 RECORDING',UPSELLING:'💸 UPSELLING',FLAG_WORD:'🚩 FLAG WORD'};
  var bodyHTML;
  if(vis.length===0){
    bodyHTML='<div class="empty"><div class="ee">✅</div><div class="et">No results for this filter</div></div>';
  } else {
    bodyHTML=vis.map(function(r){
      var sev=r.sev==='HIGH'?'<span class="sH">▲ HIGH</span>':'<span class="sM">◆ MED</span>';
      var emailCell=r.email?'<a href="mailto:'+e(r.email)+'" style="color:#38bdf8;text-decoration:none">'+e(r.email)+'</a>':'<span style="color:#374151;font-style:italic;font-size:11px">—</span>';
      var phoneCell=r.phone?e(r.phone):'<span style="color:#374151;font-style:italic;font-size:11px">—</span>';
      var matchCell=r.found?'<span class="pill py">✓ found</span>':'<span class="pill pn">not found</span>';
      var contactCols=hasCon?'<div class="td c">'+emailCell+'</div><div class="td c">'+phoneCell+'</div><div class="td">'+matchCell+'</div>':'';
      return '<div class="trow" style="'+gridTpl+'">'+
        '<div class="td b">'+e(r.name)+'</div>'+
        '<div class="td m">'+r.ts+'</div>'+
        '<div class="td">'+e(r.msg)+'</div>'+
        '<div class="td"><span class="tag t'+r.cat+'">'+CLBL[r.cat]+'</span></div>'+
        '<div class="td">'+sev+'</div>'+
        '<div class="td">'+e(r.reason)+'</div>'+
        contactCols+
      '</div>';
    }).join('');
  }

  return '<div>'+
    '<div class="res-top">'+
      '<div class="res-tblock">'+
        '<div class="res-title">Analysis <span style="color:#f59e0b">Complete</span></div>'+
        '<div class="res-sub">'+S.messages.length.toLocaleString()+' messages · '+S.rawFlags.length+' flags → '+S.results.length+' unique people'+(hasCon?' · '+matchN+' contacts found':''+(S.csvReady?' (0 matched — names not in attendee list)':''))+'</div>'+
      '</div>'+
      '<div class="stats">'+statsHTML+'</div>'+
      '<div class="abtns">'+
        '<button class="btn-p" id="btnDL">↓ Download CSV ('+vis.length+')</button>'+
        '<button class="btn-g" id="btnNew">↺ New Analysis</button>'+
      '</div>'+
    '</div>'+
    '<div class="fbar"><span class="flbl">FILTER:</span>'+fbtns+
      '<input class="srch" id="srch" placeholder="Search name, email…" value="'+e(S.search)+'"/>'+
    '</div>'+
    '<div class="twrap">'+
      '<div class="thead" style="'+gridTpl+'">'+headHTML+'</div>'+
      '<div class="tbody">'+bodyHTML+'</div>'+
    '</div>'+
  '</div>';
}

// ── BIND ──────────────────────────────────────────────────────────────────────
function bind(){
  var bc=document.getElementById('btnChat');
  if(bc) bc.addEventListener('click',function(ev){ev.stopPropagation();document.getElementById('inputChat').click();});
  var bx=document.getElementById('btnCSV');
  if(bx) bx.addEventListener('click',function(ev){ev.stopPropagation();document.getElementById('inputCSV').click();});

  // Drag-drop on cards
  ['cardChat','cardCSV'].forEach(function(id){
    var el=document.getElementById(id); if(!el) return;
    el.addEventListener('dragover',function(ev){ev.preventDefault();el.classList.add('dragging');});
    el.addEventListener('dragleave',function(){el.classList.remove('dragging');});
    el.addEventListener('drop',function(ev){
      ev.preventDefault();el.classList.remove('dragging');
      var f=ev.dataTransfer.files[0]; if(!f) return;
      if(id==='cardChat') loadChat(f); else loadCSV(f);
    });
  });

  var br=document.getElementById('btnRun');
  if(br) br.addEventListener('click',function(){if(S.chatReady) runAnalysis();});

  document.querySelectorAll('.fb').forEach(function(b){
    b.addEventListener('click',function(){S.filter=b.getAttribute('data-f');render();});
  });
  var sr=document.getElementById('srch');
  if(sr) sr.addEventListener('input',function(){S.search=sr.value;render();});
  var dl=document.getElementById('btnDL');
  if(dl) dl.addEventListener('click',dlCSV);
  var bn=document.getElementById('btnNew');
  if(bn) bn.addEventListener('click',function(){
    Object.assign(S,{phase:'upload',chatReady:false,csvReady:false,
      chatName:'',csvName:'',messages:[],rawFlags:[],results:[],
      attendees:[],filter:'ALL',search:'',err:''});
    document.getElementById('inputChat').value='';
    document.getElementById('inputCSV').value='';
    render();
  });
}

// ── LOAD FILES ────────────────────────────────────────────────────────────────
function loadChat(file){
  if(!file.name.toLowerCase().endsWith('.txt')){S.err='Please select a .txt Zoom chat export file';render();return;}
  var rd=new FileReader();
  rd.onload=function(ev){S.messages=parseChat(ev.target.result);S.chatReady=true;S.chatName=file.name;S.err='';render();};
  rd.readAsText(file);
}
function loadCSV(file){
  if(!file.name.toLowerCase().endsWith('.csv')){S.err='Please select a .csv attendee report file';render();return;}
  var rd=new FileReader();
  rd.onload=function(ev){
    S.attendees=parseAttendeeCSV(ev.target.result);
    S.csvReady=true;S.csvName=file.name;S.err='';render();
  };
  rd.readAsText(file);
}

// Global file input listeners
document.getElementById('inputChat').addEventListener('change',function(){if(this.files[0])loadChat(this.files[0]);});
document.getElementById('inputCSV').addEventListener('change',function(){if(this.files[0])loadCSV(this.files[0]);});

render();
</script>
