<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Workshop Sentiment Analyser | Be10x</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04080f;
  --glass:rgba(8,15,28,0.72);
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.14);
  --text:#dce8f5;--muted:#4a6070;--dim:#1e3040;
  --amber:#f5a623;--red:#ef4444;--blue:#60c0fa;--green:#3dba6f;
  --orange:#fb923c;--rose:#f87171;--teal:#2dd4bf;--purple:#a78bfa;--gold:#fbbf24;
}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
#nature-canvas{position:fixed;inset:0;z-index:0;pointer-events:none;display:block}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:200;border-bottom:1px solid rgba(45,212,191,.12);padding:0 32px;height:58px;display:flex;align-items:center;gap:12px;background:rgba(4,8,15,.9);backdrop-filter:blur(24px);animation:slideDown .6s cubic-bezier(.22,1,.36,1) both}
@keyframes slideDown{from{transform:translateY(-56px);opacity:0}to{transform:translateY(0);opacity:1}}
.live-dot{width:8px;height:8px;border-radius:50%;background:#3dba6f;position:relative;flex-shrink:0}
.live-dot::before{content:'';position:absolute;inset:-5px;border-radius:50%;border:1.5px solid #3dba6f;opacity:0;animation:sonar 2.4s ease-out infinite}
.live-dot::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:1px solid #3dba6f;opacity:0;animation:sonar 2.4s .6s ease-out infinite}
@keyframes sonar{0%{transform:scale(.3);opacity:.9}100%{transform:scale(2);opacity:0}}
.logo-text{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--text);text-transform:uppercase}
.nav-badge{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);padding:4px 12px;border-radius:20px;border:1px solid rgba(45,212,191,.15);background:rgba(45,212,191,.04);letter-spacing:.04em}

/* ── PAGE ── */
.page{max-width:1200px;margin:0 auto;padding:44px 24px 100px;position:relative;z-index:10}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes slideInL{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.ani{animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both}
.d1{animation-delay:.06s}.d2{animation-delay:.14s}.d3{animation-delay:.23s}.d4{animation-delay:.32s}.d5{animation-delay:.43s}

/* ── UPLOAD SECTION ── */
.up-wrap{display:flex;flex-direction:column;align-items:center;gap:30px;padding-top:4px}
.hero{font-size:50px;font-weight:700;letter-spacing:-.05em;line-height:1.04;text-align:center}
.hero-accent{background:linear-gradient(110deg,#3dba6f 0%,#2dd4bf 40%,#60c0fa 80%,#a78bfa 100%);background-size:200% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradShift 5s ease-in-out infinite alternate}
@keyframes gradShift{from{background-position:0% 50%}to{background-position:100% 50%}}
.hero-sub{color:var(--muted);font-size:14px;text-align:center;max-width:460px;line-height:1.78;margin-top:3px}

/* ── UPLOAD CARDS ── */
.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:700px}
.upload-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:20px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:11px;cursor:pointer;position:relative;overflow:hidden;transition:border-color .3s,transform .25s,box-shadow .3s;min-height:172px}
.upload-card::before{content:'';position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse 80% 60% at 50% -10%,rgba(61,186,111,.1),transparent 70%);opacity:0;transition:opacity .35s;pointer-events:none}
.upload-card::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.05),transparent);pointer-events:none}
.upload-card:hover{border-color:rgba(61,186,111,.4);transform:translateY(-3px);box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 30px rgba(61,186,111,.07)}
.upload-card:hover::before{opacity:1}
.upload-card:hover::after{animation:cardSheen .65s ease forwards}
@keyframes cardSheen{0%{left:-60%}100%{left:120%}}
.upload-card.done{border-color:rgba(61,186,111,.4);box-shadow:0 0 28px rgba(61,186,111,.07)}.upload-card.done::before{opacity:1}
.upload-card.dragging{border-color:rgba(45,212,191,.6);background:rgba(45,212,191,.05);transform:scale(1.025)}
.icon-ring{width:50px;height:50px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:22px;transition:transform .25s;position:relative}
.icon-ring::after{content:'';position:absolute;inset:-2px;border-radius:16px;border:1px solid rgba(61,186,111,.35);opacity:0;transition:opacity .25s}
.upload-card:hover .icon-ring{transform:scale(1.1) rotate(-5deg)}.upload-card:hover .icon-ring::after,.upload-card.done .icon-ring::after{opacity:1}
.card-label{font-weight:600;font-size:13px;color:var(--text)}
.card-hint{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;text-align:center;line-height:1.6}
.card-opt{font-size:11px;color:var(--dim);font-style:italic}
.file-list{width:100%;max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.file-item{display:flex;align-items:center;gap:7px;background:rgba(61,186,111,.07);border:1px solid rgba(61,186,111,.18);border-radius:7px;padding:4px 9px;animation:slideInL .22s cubic-bezier(.22,1,.36,1) both}
.fi-name{font-size:10px;color:var(--green);font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.fi-extra{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace;white-space:nowrap}
.fi-rm{background:none;border:none;color:var(--muted);cursor:pointer;font-size:12px;padding:0 2px;line-height:1;flex-shrink:0;transition:color .15s}.fi-rm:hover{color:var(--red)}
.pick-label{margin-top:4px;display:inline-block;background:rgba(255,255,255,.04);border:1px solid var(--border2);color:var(--muted);padding:7px 18px;border-radius:9px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .22s;letter-spacing:.01em;user-select:none}
.pick-label:hover{border-color:rgba(61,186,111,.5);color:var(--green);background:rgba(61,186,111,.07)}
.cnt-badge{font-size:9px;font-family:'JetBrains Mono',monospace;background:rgba(45,212,191,.1);color:var(--teal);border:1px solid rgba(45,212,191,.22);border-radius:10px;padding:2px 7px}

/* ── RUN BUTTON ── */
.btn-run{position:relative;overflow:hidden;background:linear-gradient(110deg,#3dba6f 0%,#2dd4bf 50%,#60c0fa 100%);background-size:200% auto;border:none;color:#fff;padding:15px 56px;border-radius:14px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:700;font-size:15px;letter-spacing:.015em;transition:opacity .2s,transform .2s,box-shadow .3s;opacity:.28;pointer-events:none}
.btn-run.on{opacity:1;pointer-events:auto;box-shadow:0 8px 32px rgba(61,186,111,.3),0 0 0 1px rgba(61,186,111,.18)}
.btn-run.on:hover{transform:translateY(-2px);box-shadow:0 16px 42px rgba(61,186,111,.42)}.btn-run.on:active{transform:scale(.99)}
.btn-run::after{content:'';position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:btnShimmer 3s ease-in-out infinite}
@keyframes btnShimmer{0%{left:-80%}60%,100%{left:130%}}

/* ── DETECT TILES ── */
.detect-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:620px}
.dc{background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:15px 12px;text-align:center;transition:border-color .25s,transform .22s;cursor:default;position:relative;overflow:hidden}
.dc::before{content:'';position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);width:60%;height:36px;border-radius:50%;opacity:0;filter:blur(14px);transition:opacity .3s}
.dc:hover{transform:translateY(-3px);border-color:var(--border2)}.dc:hover::before{opacity:.55}
.dc.c1::before{background:var(--orange)}.dc.c2::before{background:var(--blue)}.dc.c3::before{background:var(--rose)}.dc.c4::before{background:var(--red)}
.di{font-size:26px;margin-bottom:7px;display:block;transition:transform .25s}.dc:hover .di{transform:scale(1.15)}
.dcat{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.1em;margin-bottom:4px}.dd{font-size:10px;color:var(--muted);line-height:1.55}
.priv{font-size:11px;color:var(--dim);font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.err-box{background:rgba(239,68,68,.07);backdrop-filter:blur(8px);border:1px solid rgba(239,68,68,.22);border-radius:11px;padding:11px 20px;color:#fca5a5;font-size:13px;max-width:520px;text-align:center;animation:popIn .3s cubic-bezier(.22,1,.36,1) both}

/* ── LOADING ── */
.load-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:90px 0}
.loader{width:44px;height:44px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,transparent 0%,#3dba6f 50%,transparent 100%);animation:spin .9s linear infinite}
.loader::before{content:'';position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
@keyframes spin{to{transform:rotate(360deg)}}
.scan-bar{width:300px;height:3px;background:rgba(255,255,255,.07);border-radius:2px;overflow:hidden}
.scan-fill{height:100%;background:linear-gradient(90deg,#3dba6f,#2dd4bf,#60c0fa);background-size:200% auto;border-radius:2px;width:0%;animation:scanAnim 1.35s cubic-bezier(.4,0,.2,1) forwards,gradMove 1.5s linear infinite}
@keyframes scanAnim{0%{width:0%}55%{width:80%}100%{width:100%}}
@keyframes gradMove{0%{background-position:0% 50%}100%{background-position:200% 50%}}
.load-txt{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.06em}

/* ── RESULTS ── */
.res-header{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;margin-bottom:22px;animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both}
.res-title-block{flex:1;min-width:200px}
.res-title{font-size:28px;font-weight:700;letter-spacing:-.03em}
.res-sub{color:var(--muted);font-size:13px;margin-top:5px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:11px;padding:10px 16px;text-align:center;min-width:80px;transition:border-color .2s,transform .2s;animation:popIn .45s cubic-bezier(.22,1,.36,1) both}
.stat:hover{border-color:var(--border2);transform:translateY(-2px)}
.sv{font-size:22px;font-weight:700;line-height:1.1}.sl{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--muted);margin-top:2px;letter-spacing:.06em}
.abtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-primary{background:linear-gradient(110deg,#3dba6f,#2dd4bf);border:none;color:#fff;padding:10px 20px;border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;font-size:13px;white-space:nowrap;transition:opacity .2s,transform .18s,box-shadow .25s;box-shadow:0 4px 16px rgba(61,186,111,.25)}
.btn-primary:hover{opacity:.9;transform:translateY(-1px);box-shadow:0 8px 24px rgba(61,186,111,.38)}
.btn-ghost{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border2);color:var(--muted);padding:10px 16px;border-radius:9px;cursor:pointer;font-family:'Inter',sans-serif;font-size:13px;transition:border-color .2s,color .2s}
.btn-ghost:hover{border-color:rgba(255,255,255,.22);color:var(--text)}
.src-strip{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px;animation:fadeUp .5s .08s cubic-bezier(.22,1,.36,1) both}
.src-chip{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:8px;padding:5px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);transition:border-color .2s}
.src-chip:hover{border-color:var(--border2)}.src-chip span{color:var(--text)}
.fbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px;align-items:center;animation:fadeUp .5s .12s cubic-bezier(.22,1,.36,1) both}
.flbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.fb{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:11px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .2s}
.fb:hover{border-color:var(--border2);color:var(--text)}.fb.on{border-color:rgba(61,186,111,.5);color:var(--green);background:rgba(61,186,111,.08)}
.srch{background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:9px;padding:7px 13px;color:var(--text);font-size:12px;font-family:'Inter',sans-serif;outline:none;width:210px;margin-left:auto;transition:border-color .2s,box-shadow .2s}
.srch:focus{border-color:rgba(61,186,111,.4);box-shadow:0 0 0 3px rgba(61,186,111,.07)}.srch::placeholder{color:var(--muted)}
.twrap{background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:16px;overflow:hidden;animation:fadeUp .5s .18s cubic-bezier(.22,1,.36,1) both}
.thead{display:flex;padding:10px 16px;background:rgba(255,255,255,.025);border-bottom:1px solid var(--border)}
.th{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);font-weight:600;letter-spacing:.1em;padding-right:10px;text-transform:uppercase}
.tbody{max-height:480px;overflow-y:auto}
.trow{display:flex;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.035);align-items:flex-start;transition:background .15s;animation:slideInL .3s cubic-bezier(.22,1,.36,1) both}
.trow:hover{background:rgba(45,212,191,.03)}.trow:last-child{border-bottom:none}
.td{font-size:12px;color:#6a8090;word-break:break-word;padding-right:10px;line-height:1.55;overflow:hidden}
.td.b{font-weight:600;color:var(--text);font-size:13px}.td.m{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}.td.c{color:var(--blue)}
.td.src{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:6px;font-size:9px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:.05em;white-space:nowrap}
.tCONTENT{color:var(--orange);background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.15)}
.tRECORDING{color:var(--blue);background:rgba(96,192,250,.1);border:1px solid rgba(96,192,250,.15)}
.tUPSELLING{color:var(--rose);background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.15)}
.tFLAG_WORD{color:#ef4444;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25)}
.sH{font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--red)}
.sM{font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--amber)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-family:'JetBrains Mono',monospace;font-weight:600}
.py{background:rgba(61,186,111,.1);color:var(--green);border:1px solid rgba(61,186,111,.2)}
.pn{background:rgba(255,255,255,.04);color:var(--muted);border:1px solid rgba(255,255,255,.08)}
.empty{text-align:center;padding:60px 0}.ee{font-size:40px;margin-bottom:12px}.et{font-size:14px;font-weight:500;color:var(--muted)}

/* ══════════════════════════════════════════
   PAYMENT CSV SECTION
══════════════════════════════════════════ */
.section-divider{
  display:flex;align-items:center;gap:16px;margin:48px 0 32px;
  animation:fadeUp .6s cubic-bezier(.22,1,.36,1) both;
}
.div-line{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--border2),transparent)}
.div-label{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;white-space:nowrap;padding:0 4px}

.pay-section{animation:fadeUp .6s .1s cubic-bezier(.22,1,.36,1) both}
.pay-hero{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.pay-icon{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(245,158,11,.08));border:1px solid rgba(251,191,36,.25);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.pay-title{font-size:20px;font-weight:700;letter-spacing:-.025em}
.pay-sub{color:var(--muted);font-size:13px;margin-top:3px}

/* pay upload card — full width single */
.pay-upload-card{
  background:var(--glass);backdrop-filter:blur(20px);
  border:1px solid var(--border);border-radius:20px;
  padding:24px 28px;display:flex;align-items:center;gap:20px;
  position:relative;overflow:hidden;
  transition:border-color .3s,transform .25s,box-shadow .3s;
  cursor:default;
}
.pay-upload-card::before{content:'';position:absolute;inset:0;border-radius:20px;background:radial-gradient(ellipse 60% 80% at 0% 50%,rgba(251,191,36,.07),transparent 70%);opacity:0;transition:opacity .35s;pointer-events:none}
.pay-upload-card.done{border-color:rgba(251,191,36,.35);box-shadow:0 0 28px rgba(251,191,36,.06)}.pay-upload-card.done::before{opacity:1}
.pay-upload-card.dragging{border-color:rgba(251,191,36,.6);background:rgba(251,191,36,.05);transform:scale(1.01)}
.pay-icon-ring{width:54px;height:54px;border-radius:14px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;transition:transform .25s}
.pay-upload-card:hover .pay-icon-ring{transform:scale(1.08) rotate(-4deg)}
.pay-upload-info{flex:1}
.pay-upload-title{font-weight:600;font-size:14px;color:var(--text);margin-bottom:4px}
.pay-upload-hint{font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;line-height:1.6}
.pay-upload-cols{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.col-badge{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 8px;border-radius:6px;border:1px solid;background:rgba(255,255,255,.04)}
.col-badge.email{color:#60c0fa;border-color:rgba(96,192,250,.25)}
.col-badge.phone{color:#3dba6f;border-color:rgba(61,186,111,.25)}
.col-badge.amount{color:#fbbf24;border-color:rgba(251,191,36,.3)}
.col-badge.name{color:#a78bfa;border-color:rgba(167,139,250,.25)}
.col-badge.other{color:var(--muted);border-color:var(--border)}
.pay-pick-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}
.pay-pick-label{display:inline-block;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.3);color:#fbbf24;padding:8px 20px;border-radius:10px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;transition:all .22s;white-space:nowrap;user-select:none}
.pay-pick-label:hover{background:rgba(251,191,36,.15);box-shadow:0 0 16px rgba(251,191,36,.2)}
.pay-file-loaded{font-size:11px;color:var(--green);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:5px}

/* column mapper */
.col-map-wrap{margin-top:18px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:14px;padding:18px 20px;animation:fadeUp .4s cubic-bezier(.22,1,.36,1) both}
.col-map-title{font-size:12px;font-weight:600;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.col-map-title span{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);font-weight:400;letter-spacing:.06em;text-transform:uppercase}
.col-map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.col-map-item{display:flex;flex-direction:column;gap:5px}
.col-map-label{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.col-map-label.req{color:var(--gold)}
.col-map-label.opt{color:var(--muted)}

(function(){

  function drawSky(){

    [{y:.12,w:.6,h1:'rgba(29,185,84,.07)',h2:'rgba(45,212,191,.05)',ph:0},{y:.22,w:.8,h1:'rgba(96,192,250,.06)',h2:'rgba(167,139,250,.04)',ph:1.5},{y:.06,w:.45,h1:'rgba(45,212,191,.05)',h2:'rgba(61,186,111,.07)',ph:3}].forEach(function(a){

  var stars=[];for(var i=0;i<160;i++)stars.push({x:Math.random(),y:Math.random()*.55,r:Math.random()*.9+.2,p:Math.random()*Math.PI*2,sp:Math.random()*.008+.003});
  function drawStars(){stars.forEach(function(s){var a=.35+.35*Math.sin(t*s.sp*60+s.p);ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fillStyle='rgba(200,230,255,'+a+')';ctx.fill();});}
  function drawHills(){
    ctx.beginPath();ctx.moveTo(0,H*.68);for(var x=0;x<=W;x+=6){ctx.lineTo(x,H*.62+Math.sin(x*.004+t*.06)*H*.04+Math.sin(x*.009+1)*H*.025);}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle='rgba(5,18,30,.9)';ctx.fill();
    ctx.beginPath();ctx.moveTo(0,H*.78);for(var x=0;x<=W;x+=6){ctx.lineTo(x,H*.72+Math.sin(x*.006+t*.04+2)*H*.035+Math.sin(x*.012)*H*.02);}ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle='rgba(4,14,24,.95)';ctx.fill();

  var blades=[];for(var i=0;i<90;i++)blades.push({x:Math.random()*1.1-.05,h:Math.random()*.08+.04,w:Math.random()*1.5+.5,phase:Math.random()*Math.PI*2,spd:Math.random()*.6+.4,col:Math.random()>.5?'rgba(34,160,70,':'rgba(29,130,60,'});
  function drawGrass(){var wind=Math.sin(t*.3)*.015+(mx-.5)*.025;blades.forEach(function(b){var bx=b.x*W,by=H*.76,bh=b.h*H,sw=(wind+Math.sin(t*b.spd+b.phase)*.012)*bh*2.5,a=.35+.2*Math.abs(Math.sin(t*b.spd*.5+b.phase));ctx.beginPath();ctx.moveTo(bx,by);ctx.quadraticCurveTo(bx+sw*.4,by-bh*.5,bx+sw,by-bh);ctx.lineWidth=b.w;ctx.strokeStyle=b.col+a+')';ctx.stroke();});}

  var trees=[];for(var i=0;i<14;i++)trees.push({x:Math.random(),h:Math.random()*.12+.07,trunk:Math.random()*.012+.006,layer:Math.random()>.5?0:1,col:Math.random()>.5?'rgba(15,55,30,':'rgba(12,45,25,'});trees.sort(function(a,b){return a.layer-b.layer;});
  function drawTrees(){var wind=Math.sin(t*.25)*.008+(mx-.5)*.012;trees.forEach(function(tr){var tx=tr.x*W,gy=tr.layer===0?H*.73:H*.77,th=tr.h*H,sw=wind*th*.4;ctx.beginPath();ctx.moveTo(tx,gy);ctx.lineTo(tx+sw*.3,gy-th*.35);ctx.lineWidth=tr.trunk*W;ctx.strokeStyle='rgba(20,30,20,.8)';ctx.stroke();for(var l=0;l<3;l++){var ly=gy-th*(.35+l*.22),lw=th*(.7-l*.15),la=.55+.15*l;ctx.beginPath();ctx.moveTo(tx+sw*(l+1)*.15,ly);ctx.lineTo(tx-lw*.55+sw*(l+1)*.1,ly+lw*.5);ctx.lineTo(tx+lw*.55+sw*(l+1)*.2,ly+lw*.5);ctx.closePath();ctx.fillStyle=tr.col+la+')';ctx.fill();}});}
  var flies=[];for(var i=0;i<55;i++)flies.push({x:Math.random(),y:.55+Math.random()*.38,vx:(Math.random()-.5)*.0008,vy:(Math.random()-.5)*.0006,phase:Math.random()*Math.PI*2,sp:Math.random()*.04+.02,r:Math.random()*1.4+.6,col:Math.random()>.5?'rgba(180,255,130,':'rgba(120,255,200,'});
  function drawFireflies(){var attr=(mx-.5)*.001;flies.forEach(function(f){f.x+=f.vx+attr;f.y+=f.vy+Math.sin(t*.15+f.phase)*.0003;if(f.x<0)f.x=1;if(f.x>1)f.x=0;if(f.y<.52)f.y=.52;if(f.y>.94)f.y=.94;var glow=.5+.5*Math.sin(t*f.sp*60+f.phase);if(glow<.15)return;var fx=f.x*W,fy=f.y*H,g=ctx.createRadialGradient(fx,fy,0,fx,fy,f.r*8);g.addColorStop(0,f.col+(glow*.85)+')');g.addColorStop(.4,f.col+(glow*.3)+')');g.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(fx,fy,f.r*8,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(fx,fy,f.r*.6,0,Math.PI*2);ctx.fillStyle=f.col+'1)';ctx.fill();});}
  function drawMoon(){var mlx=(.72+(mx-.5)*.04)*W,mly=(.1+(my-.5)*.03)*H,mg=ctx.createRadialGradient(mlx,mly,0,mlx,mly,48);mg.addColorStop(0,'rgba(255,250,220,.9)');mg.addColorStop(.3,'rgba(240,235,200,.5)');mg.addColorStop(.7,'rgba(200,210,180,.08)');mg.addColorStop(1,'transparent');ctx.beginPath();ctx.arc(mlx,mly,48,0,Math.PI*2);ctx.fillStyle=mg;ctx.fill();var md=ctx.createRadialGradient(mlx-3,mly-3,0,mlx,mly,18);md.addColorStop(0,'rgba(255,252,230,.95)');md.addColorStop(.6,'rgba(240,238,210,.85)');md.addColorStop(1,'rgba(200,210,180,.4)');ctx.beginPath();ctx.arc(mlx,mly,18,0,Math.PI*2);ctx.fillStyle=md;ctx.fill();}
  function drawFog(){ctx.save();ctx.globalAlpha=.07+Math.sin(t*.2)*.03;for(var r=0;r<3;r++){var fx=((t*.012+r*.4)%1.3-.15)*W,fy=H*(.68+r*.03),fg=ctx.createRadialGradient(fx,fy,0,fx,fy,W*.3);fg.addColorStop(0,'rgba(200,230,240,.8)');fg.addColorStop(1,'transparent');ctx.beginPath();ctx.ellipse(fx,fy,W*.3,H*.04,0,0,Math.PI*2);ctx.fillStyle=fg;ctx.fill();}ctx.restore();}
  function frame(){t+=.016;mx+=(tmx-mx)*.04;my+=(tmy-my)*.04;drawSky();drawStars();drawMoon();drawHills();drawTrees();drawGrass();drawWater();drawFog();drawFireflies();requestAnimationFrame(frame);}
  requestAnimationFrame(frame);
})();

/* ── HELPERS ── */
function e(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sn(n){return n.length>26?n.slice(0,23)+'…':n;}
function normStrict(n){return(n||'').toLowerCase().replace(/[^a-z]/g,'');}
function normN(n){return(n||'').toLowerCase().replace(/[^a-z\s]/g,' ').replace(/\s+/g,' ').trim();}
function tokN(n){return normN(n).split(' ').filter(function(t){return t.length>1;});}
function cleanPhone(p){return(p||'').replace(/[\s\-().+]/g,'').replace(/^0+/,'').slice(-10);}
function cleanEmail(e){return(e||'').trim().toLowerCase();}
function cleanAmount(a){var n=parseFloat(String(a).replace(/[^0-9.]/g,''));return isNaN(n)?null:n;}
function fmtAmount(a){if(a===null||a===undefined)return null;return '₹'+Number(a).toLocaleString('en-IN',{minimumFractionDigits:0,maximumFractionDigits:2});}

function splitCSV(line){
  var res=[],cur='',inQ=false;
  for(var i=0;i<line.length;i++){var c=line[i];if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(c===','&&!inQ){res.push(cur.trim());cur='';}else cur+=c;}
  res.push(cur.trim());return res;
}

/* ── COLUMN AUTO-DETECTION ── */
function autoDetectCols(headers){
  var map={email:'',phone:'',amount:'',name:''};
  var EMAIL_HINTS=/^(email|e-mail|mail|emailid|email_id|email address)$/i;
  var PHONE_HINTS=/^(phone|mobile|cell|contact|whatsapp|ph|mob|phone_no|mobile_no|phonenumber|mobilenumber|contact_no)$/i;
  var AMOUNT_HINTS=/^(amount|paid|payment|fee|price|total|order_amount|transaction|amt|value|cost|charges|rs|inr|rupees)$/i;
  var NAME_HINTS=/^(name|full_?name|customer|customer_name|student|participant|attendee|user)$/i;
  headers.forEach(function(h){
    var hh=h.trim();
    if(!map.email&&EMAIL_HINTS.test(hh))map.email=h;
    else if(!map.phone&&PHONE_HINTS.test(hh))map.phone=h;
    else if(!map.amount&&AMOUNT_HINTS.test(hh))map.amount=h;
    else if(!map.name&&NAME_HINTS.test(hh))map.name=h;
  });
  return map;
}

/* ── PAYMENT CSV PARSER ── */
function parsePayCSV(txt){
  var lines=txt.split(/\r?\n/);
  var hi=-1;
  for(var i=0;i<lines.length;i++){if(lines[i].trim()&&splitCSV(lines[i]).length>1){hi=i;break;}}
  if(hi<0)return{headers:[],rows:[]};
  var headers=splitCSV(lines[hi]).map(function(h){return h.trim();});
  var rows=[];
  for(var i=hi+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    var vals=splitCSV(lines[i]),obj={};
    headers.forEach(function(h,j){obj[h]=(vals[j]||'').trim();});
    rows.push(obj);
  }
  return{headers:headers,rows:rows};
}

/* ── ATTENDEE CSV PARSER (for contact enrichment) ── */
function parseAttendeeCSV(txt){
  var lines=txt.split(/\r?\n/),hi=-1;
  for(var i=0;i<lines.length;i++){if(lines[i].indexOf('First Name')>=0&&lines[i].indexOf('Email')>=0){hi=i;break;}}
  if(hi<0)for(var i=0;i<lines.length;i++){if(lines[i].indexOf('User Name')>=0&&lines[i].indexOf('Email')>=0){hi=i;break;}}
  if(hi<0)return[];
  var headers=splitCSV(lines[hi]),rows=[];
  for(var i=hi+1;i<lines.length;i++){
    if(!lines[i].trim())continue;
    var vals=splitCSV(lines[i]),obj={};
    headers.forEach(function(h,j){obj[h.trim()]=(vals[j]||'').trim();});rows.push(obj);
  }
  var byEmail={};
  rows.forEach(function(r){
    var email=cleanEmail(r['Email']||'');if(!email||email.indexOf('@')<0)return;
    var phone=cleanPhone(r['Phone']||r['Mobile']||'');
    var uname=(r['User Name (Original Name)']||r['Name']||'').trim();
    var fname=(r['First Name']||'').trim(),lname=(r['Last Name']||'').trim();
    var full=(fname+' '+lname).trim(),ex=byEmail[email];
    if(!ex||(phone&&!ex.phone))byEmail[email]={uname:uname,fname:fname,lname:lname,full:full,email:email,phone:phone};
  });
  return Object.values(byEmail);
}

/* ── SENTIMENT ANALYSIS ── */
function parseChat(txt,src){
  var msgs=[],cur=null;
  txt.split('\n').forEach(function(raw){
    var line=raw.replace(/\r$/,'');
    var m=line.match(/^(\d{2}:\d{2}:\d{2}) From (.+?) to (.+?):\s*$/);
    if(m){if(cur)msgs.push(cur);cur={ts:m[1],name:m[2].trim(),msg:'',source:src};}
    else if(cur&&(line[0]==='\t'||line.slice(0,2)==='  '))cur.msg+=(cur.msg?' ':'')+line.replace(/^\s+/,'');
  });
  if(cur)msgs.push(cur);return msgs;
}
function buildIndex(att){
  var idx={};
  att.forEach(function(a){var ku=normStrict(a.uname);if(ku.length>2)idx[ku]=a;var kf=normStrict(a.full);if(kf.length>2)idx[kf]=a;var kfn=normStrict(a.fname);if(kfn.length>3&&!idx[kfn])idx[kfn]=a;});
  return idx;
}
function findAttendee(n,att,idx){
  var cn=normStrict(n),ct=tokN(n);if(!cn||!ct.length)return null;
  if(idx[cn])return idx[cn];
  if(cn.length>4){for(var em in idx){var a=idx[em],ku=normStrict(a.uname),kf=normStrict(a.full);if(ku.indexOf(cn)===0||kf.indexOf(cn)===0)return a;if(cn.indexOf(ku)===0&&ku.length>4)return a;}}
  var best=null,bs=0;
  att.forEach(function(a){['uname','full'].forEach(function(f){var at=tokN(a[f]);if(!at.length)return;var m=ct.filter(function(t){return at.indexOf(t)>=0;});if(!m.length||m.length<ct.length)return;var sc=m.length/Math.max(ct.length,at.length);if(sc>bs){bs=sc;best=a;}});});
  return bs>=0.5?best:null;
}
function analyse(messages){
  var found=[];
  messages.forEach(function(m){
    if(HOSTS.some(function(h){return m.name.toLowerCase().indexOf(h)>=0;}))return;
    var txt=m.msg.trim();if(txt.length<8)return;
    RULES.forEach(function(rule){for(var p=0;p<rule.pats.length;p++){if(!rule.pats[p].test(txt))continue;var sev=rule.sev||'MEDIUM';if(rule.hi&&rule.hi.some(function(hp){return hp.test(txt);}))sev='HIGH';found.push({name:m.name.trim(),ts:m.ts,msg:txt,cat:rule.cat,sev:sev,reason:rule.reason,source:m.source||''});break;}});
  });
  return found;
}
function dedup(raw){var map={};raw.forEach(function(r){var k=normStrict(r.name);if(!map[k]){map[k]=r;}else{var nr=CAT_RANK[r.cat]*10+SEV_RANK[r.sev],er=CAT_RANK[map[k].cat]*10+SEV_RANK[map[k].sev];if(nr>er)map[k]=r;}});return Object.values(map);}
function enrich(dd,att){
  if(!att.length)return dd.map(function(r){return Object.assign({},r,{email:'',phone:'',found:false});});
  var idx=buildIndex(att);
  return dd.map(function(r){var a=findAttendee(r.name,att,idx);return Object.assign({},r,{email:a?a.email:'',phone:a?a.phone:'',found:!!a});});
}

/* ── PAYMENT MATCHING ENGINE ── */
function runPayMatch(){
  if(!S.payFile||!S.results.length)return;
  var cm=S.payColMap;
  if(!cm.email&&!cm.phone){S.err='Please map at least Email or Phone column';render();return;}
  if(!cm.amount){S.err='Please map the Amount column';render();return;}

  // Build lookup maps from payment CSV
  var byEmail={},byPhone={};
  S.payFile.rows.forEach(function(row){
    var em=cm.email?cleanEmail(row[cm.email]):'';
    var ph=cm.phone?cleanPhone(row[cm.phone]):'';
    var amt=cm.amount?cleanAmount(row[cm.amount]):null;
    var payName=cm.name?row[cm.name]:'';
    // extra columns
    var extra={};
    (cm.extra||[]).forEach(function(col){extra[col]=row[col]||'';});
    var entry={amount:amt,payName:payName,extra:extra,rawEmail:em,rawPhone:ph};
    if(em&&em.indexOf('@')>=0)byEmail[em]=entry;
    if(ph&&ph.length>=5)byPhone[ph]=entry;
  });

  // Match each flagged result
  S.payResults=S.results.map(function(r){
    var em=cleanEmail(r.email||'');
    var ph=cleanPhone(r.phone||'');
    var match=null,how='none';

    // try email first
    if(em&&byEmail[em]){match=byEmail[em];how='email';}
    // try phone
    if(!match&&ph&&byPhone[ph]){match=byPhone[ph];how='phone';}
    // try both (double confirm)
    if(match&&em&&byEmail[em]&&ph&&byPhone[ph]&&byEmail[em]===byPhone[ph])how='both';

    return Object.assign({},r,{
      payAmount:match?match.amount:null,
      payAmountFmt:match?fmtAmount(match.amount):null,
      payMatchHow:how,
      payName:match?match.payName:'',
      payExtra:match?match.extra:{}
    });
  });

  S.payPhase='done';
  render();
}

/* ── ANALYSIS RUN ── */
function runAnalysis(){
  document.getElementById('app').innerHTML='<div class="load-wrap"><div class="loader"></div><div class="scan-bar"><div class="scan-fill"></div></div><div class="load-txt">Scanning messages for sentiment signals&hellip;</div></div>';
  setTimeout(function(){
    try{
      S.messages=[];S.chatFiles.forEach(function(cf){S.messages=S.messages.concat(cf.messages);});
      var allAtt=[];S.csvFiles.forEach(function(cf){allAtt=allAtt.concat(cf.attendees);});
      var eMap={};allAtt.forEach(function(a){if(!eMap[a.email]||(a.phone&&!eMap[a.email].phone))eMap[a.email]=a;});
      S.attendees=Object.values(eMap);var raw=analyse(S.messages);
      S.rawFlags=raw;S.results=enrich(dedup(raw),S.attendees);
      S.phase='results';S.payPhase='idle';S.payResults=[];render();
    }catch(err){S.err='Error: '+err.message;render();}
  },1350);
}

/* ── UNIFIED CSV DOWNLOAD ── */
function dlCSV(){
  // Use payResults if available (has amount), otherwise fall back to plain results
  var source=S.payPhase==='done'?visiblePay():visibleResults();
  var hasPay=S.payPhase==='done';
  var q=function(s){return'"'+String(s||'').replace(/"/g,'""')+'"';};
  var hdr=['Name','Message','Email','Phone','Category','Severity','Amount Paid','Matched By','Reason','Timestamp','Source'];
  var rows=source.map(function(r){
    return[
      q(r.name),
      q(r.msg),
      q(r.email||''),
      q(r.phone||''),
      q(r.cat),
      q(r.sev),
      q(hasPay?(r.payAmountFmt||'Not found'):'N/A'),
      q(hasPay?r.payMatchHow:'N/A'),
      q(r.reason),
      q(r.ts),
      q(r.source||'')
    ].join(',');
  });
  _dl([hdr.join(',')].concat(rows).join('\n'),'flagged_attendees_with_payments.csv');
}
function dlPayCSV(){dlCSV();}
function _dl(csv,fname){var url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));var a=document.createElement('a');a.href=url;a.download=fname;a.click();URL.revokeObjectURL(url);}

function visibleResults(){
  return S.results.filter(function(r){
    if(S.filter!=='ALL'&&r.cat!==S.filter)return false;
    if(S.search){var hay=(r.name+' '+r.msg+' '+(r.email||'')+' '+(r.phone||'')+' '+(r.source||'')).toLowerCase();if(hay.indexOf(S.search.toLowerCase())<0)return false;}
    return true;
  });
}
function visiblePay(){
  return S.payResults.filter(function(r){
    if(S.payFilter==='matched'&&r.payMatchHow==='none')return false;
    if(S.payFilter==='unmatched'&&r.payMatchHow!=='none')return false;
    if(S.paySearch){var hay=(r.name+' '+(r.email||'')+' '+(r.phone||'')+' '+(r.payAmountFmt||'')).toLowerCase();if(hay.indexOf(S.paySearch.toLowerCase())<0)return false;}
    return true;
  });
}

function loadChat(file){
  if(!file.name.toLowerCase().endsWith('.txt')){S.err='Please select .txt Zoom chat export files';render();return;}
  if(S.chatFiles.some(function(cf){return cf.name===file.name;}))return;
  var rd=new FileReader();rd.onload=function(ev){S.chatFiles.push({name:file.name,messages:parseChat(ev.target.result,file.name)});S.err='';render();};rd.readAsText(file);
}
function loadAttendeeCsv(file){
  if(!file.name.toLowerCase().endsWith('.csv')){S.err='Please select .csv attendee report files';render();return;}
  if(S.csvFiles.some(function(cf){return cf.name===file.name;}))return;
  var rd=new FileReader();rd.onload=function(ev){S.csvFiles.push({name:file.name,attendees:parseAttendeeCSV(ev.target.result)});S.err='';render();};rd.readAsText(file);
}
function loadPayCSV(file){
  if(!file.name.toLowerCase().endsWith('.csv')){S.err='Please select a .csv payment file';render();return;}
  var rd=new FileReader();
  rd.onload=function(ev){
    var parsed=parsePayCSV(ev.target.result);
    if(!parsed.headers.length){S.err='Could not parse payment CSV — no headers found';render();return;}
    S.payFile={name:file.name,headers:parsed.headers,rows:parsed.rows};
    S.payColMap=autoDetectCols(parsed.headers);
    S.payColMap.extra=[];
    S.payPhase='mapped';S.err='';render();
    // scroll to payment section
    setTimeout(function(){var el=document.getElementById('pay-section');if(el)el.scrollIntoView({behavior:'smooth',block:'start'});},200);
  };
  rd.readAsText(file);
}

    '<div class="fbar"><span class="flbl">Category</span>'+fbtns+'</div>'+
    '<div class="fbar" style="margin-top:-8px"><span class="flbl">Amount</span>'+pfbtns+'<input class="srch" id="srchPay" placeholder="Search name, email, amount&hellip;" value="'+e(S.paySearch)+'"/></div>'+
    '<div class="twrap"><div class="thead" style="'+gt+'">'+hc.map(function(c){return'<div class="th">'+c+'</div>';}).join('')+'</div><div class="tbody">'+bodyHTML+'</div></div>'+
  '</div>';
}

/* ── PAYMENT SECTION ── */
function renderPaymentSection(){
  var headers=S.payFile?S.payFile.headers:[];
  var cm=S.payColMap;

  // Column mapper selects
  function selOpts(val,allowBlank){
    var opts=allowBlank?'<option value="">— not mapped —</option>':'';
    headers.forEach(function(h){opts+='<option value="'+e(h)+'"'+(h===val?' selected':'')+'>'+e(h)+'</option>';});
    return opts;
  }

  var colMapper='';
  if(S.payPhase==='mapped'||S.payPhase==='done'){
    colMapper='<div class="col-map-wrap">'+
      '<div class="col-map-title">Map CSV columns <span>detected columns shown below — correct if needed</span></div>'+
      '<div class="col-map-grid">'+
        '<div class="col-map-item"><div class="col-map-label req">&#9679; Email column</div><select class="col-map-select" id="cm-email"><option value="">— not mapped —</option>'+selOpts(cm.email)+'</select></div>'+
        '<div class="col-map-item"><div class="col-map-label req">&#9679; Phone column</div><select class="col-map-select" id="cm-phone"><option value="">— not mapped —</option>'+selOpts(cm.phone)+'</select></div>'+
        '<div class="col-map-item"><div class="col-map-label req">&#9733; Amount column</div><select class="col-map-select" id="cm-amount"><option value="">— not mapped —</option>'+selOpts(cm.amount)+'</select></div>'+
        '<div class="col-map-item"><div class="col-map-label opt">Name column (optional)</div><select class="col-map-select" id="cm-name"><option value="">— not mapped —</option>'+selOpts(cm.name,true)+'</select></div>'+
      '</div>'+
      '<button class="btn-pay" id="btnPayMatch">&#128280; Match &amp; Show Amounts</button>'+
    '</div>';
  }

  var fileInfo='';
  if(S.payFile){
    fileInfo='<div class="pay-file-loaded">&#9989; '+e(sn(S.payFile.name))+' &middot; '+S.payFile.rows.length+' rows &middot; '+headers.length+' columns</div>'+
      '<div class="pay-upload-cols">'+
        headers.map(function(h){
          var cls='other';
          if(h===cm.email)cls='email';else if(h===cm.phone)cls='phone';else if(h===cm.amount)cls='amount';else if(h===cm.name)cls='name';
          return'<span class="col-badge '+cls+'">'+e(h)+'</span>';
        }).join('')+
      '</div>';
  }

  var needsResults=S.phase!=='results';

  return'<div class="section-divider"><div class="div-line"></div><div class="div-label">&#128280; Payment Matching</div><div class="div-line"></div></div>'+
    '<div class="pay-section" id="pay-section">'+
      '<div class="pay-hero">'+
        '<div class="pay-icon">&#128280;</div>'+
        '<div><div class="pay-title">Payment <span style="background:linear-gradient(110deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Amount Lookup</span></div>'+
        '<div class="pay-sub">Upload your payment CSV — we match by email &amp; phone and merge Name, Message, Email, Phone &amp; Amount into one single table above.</div></div>'+
      '</div>'+
      (needsResults?'<div class="err-box" style="margin-bottom:16px">&#9888; Run sentiment analysis first — flagged attendees are needed for matching.</div>':'')+
      '<div class="pay-upload-card '+(S.payFile?'done':'')+'" id="cardPayCSV">'+
        '<div class="pay-icon-ring">&#128176;</div>'+
        '<div class="pay-upload-info">'+
          '<div class="pay-upload-title">'+(S.payFile?e(sn(S.payFile.name)):'Payment / Orders CSV')+'</div>'+
          (S.payFile?fileInfo:'<div class="pay-upload-hint">Upload a CSV with columns like: Name, Email, Phone, Amount, Order ID, etc.<br>We auto-detect column types — you can correct them before matching.</div>')+
        '</div>'+
        '<div class="pay-pick-wrap">'+
          '<label class="pay-pick-label" for="inputPayCSV">'+
            (S.payFile?'&#8635; Change file':'&#128194; Upload CSV')+
          '</label>'+
          (!S.payFile?'':'<button class="btn-ghost" style="font-size:11px;padding:6px 12px" id="btnClearPay">&#10005; Clear</button>')+
        '</div>'+
      '</div>'+
      colMapper+
    '</div>';
}

function renderPayResults(){
  var vis=visiblePay();
  var matched=S.payResults.filter(function(r){return r.payMatchHow!=='none';});
  var totalAmt=0;matched.forEach(function(r){if(r.payAmount!==null)totalAmt+=r.payAmount;});
  var avgAmt=matched.length?totalAmt/matched.length:0;
  var maxAmt=0;matched.forEach(function(r){if(r.payAmount&&r.payAmount>maxAmt)maxAmt=r.payAmount;});

  var statsHTML=[
    {l:'FLAGGED PEOPLE',v:S.payResults.length,c:'#ef4444'},
    {l:'PAYMENT FOUND',v:matched.length,c:'#fbbf24'},
    {l:'NOT FOUND',v:S.payResults.length-matched.length,c:'#4a6070'},
    {l:'TOTAL AT RISK',v:fmtAmount(totalAmt),c:'#f59e0b'},
    {l:'AVG PAID',v:fmtAmount(Math.round(avgAmt)),c:'#3dba6f'},
    {l:'HIGHEST',v:fmtAmount(maxAmt),c:'#60c0fa'}
  ].map(function(s,i){return'<div class="pay-stat" style="animation-delay:'+(i*.07)+'s"><div class="ps-v" style="color:'+s.c+'">'+s.v+'</div><div class="ps-l">'+s.l+'</div></div>';}).join('');

  var cm=S.payColMap,extras=(cm.extra||[]);
  var W=['150px','140px','120px','95px','60px','90px','120px'];
  var hc=['NAME','EMAIL','PHONE','CATEGORY','SEV','MATCHED BY','AMOUNT PAID'];
  extras.forEach(function(col){W.push('minmax(80px,1fr)');hc.push(col.toUpperCase());});
  var gt='display:grid;grid-template-columns:'+W.join(' ');

  var bodyHTML=vis.length===0?'<div class="empty"><div class="ee">&#128280;</div><div class="et">No results for this filter</div></div>':vis.map(function(r,i){
    var sev=r.sev==='HIGH'?'<span class="sH">&#9650; HIGH</span>':'<span class="sM">&#9670; MED</span>';
    var howBadge={email:'<span class="match-how match-email">&#9993; email</span>',phone:'<span class="match-how match-phone">&#128222; phone</span>',both:'<span class="match-how match-both">&#10004; both</span>',none:'<span class="match-how match-none">&#10008; none</span>'}[r.payMatchHow]||'';
    var amtCell=r.payAmountFmt?'<span class="amount-badge">'+e(r.payAmountFmt)+'</span>':'<span class="amount-none">not found</span>';
    var extraCells=extras.map(function(col){return'<div class="td" style="font-size:11px">'+e(r.payExtra&&r.payExtra[col]||'&mdash;')+'</div>';}).join('');
    var email=r.email?'<a href="mailto:'+e(r.email)+'" style="color:#60c0fa;text-decoration:none;font-size:11px">'+e(r.email)+'</a>':'<span style="color:#1e3040;font-size:11px">&mdash;</span>';
    var phone=r.phone?'<span style="font-family:monospace;font-size:11px">'+e(r.phone)+'</span>':'<span style="color:#1e3040;font-size:11px">&mdash;</span>';
    return'<div class="trow" style="'+gt+';animation-delay:'+Math.min(i*.028,.5)+'s">'+
      '<div class="td b">'+e(r.name)+'</div>'+
      '<div class="td c">'+email+'</div>'+
      '<div class="td">'+phone+'</div>'+
      '<div class="td"><span class="tag t'+r.cat+'" style="font-size:8px">'+r.cat+'</span></div>'+
      '<div class="td">'+sev+'</div>'+
      '<div class="td">'+howBadge+'</div>'+
      '<div class="td">'+amtCell+'</div>'+
      extraCells+
    '</div>';
  }).join('');

  var pfbtns=[{v:'all',l:'All'},{v:'matched',l:'&#9989; Matched'},{v:'unmatched',l:'&#10008; Not Found'}].map(function(f){return'<button class="fb'+(S.payFilter===f.v?' on':'')+'" data-pf="'+f.v+'">'+f.l+'</button>';}).join('');

  return'<div class="pay-results" style="margin-top:20px">'+
    '<div class="pay-summary-grid">'+statsHTML+'</div>'+
    '<div class="pay-note">Matched '+matched.length+' of '+S.payResults.length+' flagged attendees &middot; Total revenue at risk: '+fmtAmount(totalAmt)+'</div>'+
    '<div class="fbar"><span class="flbl">Filter</span>'+pfbtns+'<input class="srch" id="srchPay" placeholder="Search name, email, amount&hellip;" value="'+e(S.paySearch)+'"/><button class="btn-primary" id="btnDLPay" style="margin-left:8px;padding:7px 14px;font-size:12px">&#8595; Export ('+vis.length+')</button></div>'+
    '<div class="twrap"><div class="thead" style="'+gt+'">'+hc.map(function(c){return'<div class="th">'+c+'</div>';}).join('')+'</div><div class="tbody">'+bodyHTML+'</div></div>'+
  '</div>';
}

/* ══════════════════════════════════
   EVENT BINDING
══════════════════════════════════ */
function bind(){
  /* remove file buttons */
  document.querySelectorAll('.fi-rm').forEach(function(btn){
    btn.addEventListener('click',function(ev){
      ev.preventDefault();ev.stopPropagation();
      var type=btn.getAttribute('data-type'),idx=parseInt(btn.getAttribute('data-idx'),10);
      if(type==='chat')S.chatFiles.splice(idx,1);else S.csvFiles.splice(idx,1);render();
    });
  });
  /* drag-drop chat / attendee cards */
  ['cardChat','cardCSV'].forEach(function(id){
    var el=document.getElementById(id);if(!el)return;
    el.addEventListener('dragover',function(ev){ev.preventDefault();el.classList.add('dragging');});
    el.addEventListener('dragleave',function(){el.classList.remove('dragging');});
    el.addEventListener('drop',function(ev){ev.preventDefault();el.classList.remove('dragging');Array.from(ev.dataTransfer.files).forEach(function(f){if(id==='cardChat')loadChat(f);else loadAttendeeCsv(f);});});
  });
  /* drag-drop payment card */
  var pc=document.getElementById('cardPayCSV');
  if(pc){
    pc.addEventListener('dragover',function(ev){ev.preventDefault();pc.classList.add('dragging');});
    pc.addEventListener('dragleave',function(){pc.classList.remove('dragging');});
    pc.addEventListener('drop',function(ev){ev.preventDefault();pc.classList.remove('dragging');if(ev.dataTransfer.files[0])loadPayCSV(ev.dataTransfer.files[0]);});
  }
  /* run sentiment */
  var br=document.getElementById('btnRun');if(br)br.addEventListener('click',function(){if(S.chatFiles.length>0)runAnalysis();});
  /* filters */
  document.querySelectorAll('.fb').forEach(function(b){
    b.addEventListener('click',function(){
      if(b.hasAttribute('data-f')){S.filter=b.getAttribute('data-f');render();}
      if(b.hasAttribute('data-pf')){S.payFilter=b.getAttribute('data-pf');render();}
    });
  });
  /* search */
  var sr=document.getElementById('srch');if(sr)sr.addEventListener('input',function(){S.search=sr.value;render();});
  var sp=document.getElementById('srchPay');if(sp)sp.addEventListener('input',function(){S.paySearch=sp.value;render();});
  /* downloads */
  var dl=document.getElementById('btnDL');if(dl)dl.addEventListener('click',dlCSV);
  var dlp=document.getElementById('btnDLPay');if(dlp)dlp.addEventListener('click',dlPayCSV);
  /* new analysis */
  var bn=document.getElementById('btnNew');if(bn)bn.addEventListener('click',function(){Object.assign(S,{phase:'upload',chatFiles:[],csvFiles:[],messages:[],rawFlags:[],results:[],attendees:[],filter:'ALL',search:'',err:'',payFile:null,payColMap:{email:'',phone:'',amount:'',name:'',extra:[]},payResults:[],payPhase:'idle',paySearch:'',payFilter:'all'});render();});
  /* column mapper selects */
  ['email','phone','amount','name'].forEach(function(field){
    var sel=document.getElementById('cm-'+field);
    if(sel)sel.addEventListener('change',function(){S.payColMap[field]=sel.value;});
  });
  /* pay match button */
  var bpm=document.getElementById('btnPayMatch');if(bpm)bpm.addEventListener('click',runPayMatch);
  /* clear pay */
  var bcp=document.getElementById('btnClearPay');if(bcp)bcp.addEventListener('click',function(){S.payFile=null;S.payColMap={email:'',phone:'',amount:'',name:'',extra:[]};S.payResults=[];S.payPhase='idle';render();});
}

render();
</script>
</body>
</html>
